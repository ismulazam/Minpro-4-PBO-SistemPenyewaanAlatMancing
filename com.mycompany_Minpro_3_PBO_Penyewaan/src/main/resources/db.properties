# Konfigurasi database (dipakai oleh JDBC dan Hibernate)
db.url=jdbc:mysql://localhost:3306/db_penyewaan_mancing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Makassar
db.user=root
db.password=
db.driver=com.mysql.cj.jdbc.Driver

# Mode akses data: jdbc (PreparedStatement + DAO) atau orm (Hibernate + DAO)
dao.mode=orm

# Tampilkan SQL yang dibuat Hibernate di console (hanya mode orm)
orm.show_sql=false
